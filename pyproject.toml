[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-build-cache"
version = "1.0.0"
description = "A content-addressed incremental build engine with smart cache invalidation"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Vishnu Vardhan" }]
keywords = ["build", "cache", "incremental", "hashing", "sha256", "bazel"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Build Tools",
]

[project.scripts]
buildcache = "buildcache.cli:main"

[tool.setuptools]
packages = ["buildcache"]
